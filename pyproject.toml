[build-system]
requires = ["uv_build>=0.10.11,<0.11"]
build-backend = "uv_build"

[project]
name = "gitlab-bot"
version = "1.2.1"
description = ""
authors = [
    { name = "Lei Zhang", email = "coolbeevip@gmail.com" },
]
requires-python = ">=3.9,<4.0"
dependencies = [
    "aiohttp>=3.11,<4.0",
    "gidgetlab[aiohttp]>=1.1.0,<2.0.0",
    "setuptools<81",
    "langchain==0.3.6",
    "langchain-openai==0.2.5",
    "langchain-google-genai==2.0.4",
    "python-dotenv==1.0.1",
    "urllib3<2",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<0.8",
    "pytest==7.4.3",
    "coverage==7.2.7",
    "pytest-cov==4.1.0",
]

[tool.uv]
required-version = "==0.10.11"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
source-exclude = [".DS_Store"]

[tool.ruff]
line-length = 120
fix = true
target-version = "py39"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
extend-select = [
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "PGH", # pygrep-hooks
    "RUF", # ruff
    "E",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "except Exception as e:",
]
